name: Release and verify downloaded distributions
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full reviewed source commit SHA
        required: true
      version:
        description: Source package version (without v)
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate immutable inputs
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: actions/checkout@v4
        with:
          repository: maduinos/amd-fpga-mcp
          ref: ${{ inputs.source_commit }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test exact source and build offline bundles
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          python -m pip install ./source pytest
          cd source
          python -m pytest -q
          cd ..
          python scripts/build.py source "$VERSION" "$SOURCE_COMMIT"
      - name: Install bundle outside source checkout
        run: bash dist/amd-fpga-mcp-*/install.sh "$RUNNER_TEMP/prepublish"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
  windows-bundle:
    needs: build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Verify native PowerShell installer before publication
        shell: powershell
        run: |
          $asset = (Get-ChildItem dist -Filter '*windows*.zip')[0].FullName
          Expand-Archive $asset -DestinationPath unpacked
          $bundle = (Get-ChildItem unpacked -Directory)[0].FullName
          ./scripts/test-windows-wrapper.ps1 -Bundle $bundle
  publish:
    needs: [build, windows-bundle]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          if notes=$(gh release view "v$VERSION" --json body --jq .body 2>/dev/null); then
            [[ "$notes" == *"Source commit: $SOURCE_COMMIT."* ]] || { echo 'Existing release has different source provenance'; exit 1; }
            echo 'Release already exists; preserving immutable public assets and re-verifying downloads.'
          else
            gh release create "v$VERSION" dist/*.tar.gz dist/*.zip dist/SHA256SUMS --title "AMD FPGA MCP $VERSION" --notes "Linux x86_64 and Windows WSL2 x86_64. Python 3.12 required. Source commit: $SOURCE_COMMIT. Windows uses the Linux backend through WSL2; native Windows is not supported. See the deployment page for setup and validation boundaries." --target "$GITHUB_SHA"
          fi
  verify:
    needs: publish
    uses: ./.github/workflows/verify.yml
    with:
      version: ${{ inputs.version }}
  update-page:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Refresh English page after successful download verification
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref main
