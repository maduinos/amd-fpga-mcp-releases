name: Release and verify downloaded distributions
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full reviewed source commit SHA
        required: true
      version:
        description: Source package version (without v)
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate immutable inputs
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: actions/checkout@v4
        with:
          repository: maduinos/amd-fpga-mcp
          ref: ${{ inputs.source_commit }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test exact source and build offline bundles
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          python -m pip install ./source pytest
          cd source
          python -m pytest -q
          cd ..
          python scripts/build.py source "$VERSION" "$SOURCE_COMMIT"
      - name: Install bundle outside source checkout
        run: bash dist/amd-fpga-mcp-*/install.sh "$RUNNER_TEMP/prepublish"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          gh release create "v$VERSION" dist/*.tar.gz dist/*.zip dist/SHA256SUMS --title "AMD FPGA MCP $VERSION" --notes "Linux x86_64 and Windows WSL2 x86_64. Python 3.12 required. Source commit: $SOURCE_COMMIT. Windows uses the Linux backend through WSL2; native Windows is not supported. See the deployment page for setup and validation boundaries." --target "$GITHUB_SHA"
  downloaded-linux:
    needs: publish
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        archive: [linux-x86_64.tar.gz, windows-wsl2-x86_64.zip]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download public assets and verify offline installation
        env:
          VERSION: ${{ inputs.version }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          base="https://github.com/${{ github.repository }}/releases/download/v$VERSION"
          curl --fail --location --retry 3 "$base/SHA256SUMS" -o SHA256SUMS
          curl --fail --location --retry 3 "$base/amd-fpga-mcp-$VERSION-$ARCHIVE" -o "amd-fpga-mcp-$VERSION-$ARCHIVE"
          sha256sum --check --ignore-missing SHA256SUMS
          if [[ "$ARCHIVE" == *.zip ]]; then unzip -q "amd-fpga-mcp-$VERSION-$ARCHIVE"; else tar -xzf "amd-fpga-mcp-$VERSION-$ARCHIVE"; fi
          bash "amd-fpga-mcp-$VERSION/install.sh" "$RUNNER_TEMP/downloaded"
  downloaded-windows:
    needs: publish
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Download ZIP, verify files and exercise PowerShell forwarding
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $base = "https://github.com/${{ github.repository }}/releases/download/v$env:VERSION"
          $asset = "amd-fpga-mcp-$env:VERSION-windows-wsl2-x86_64.zip"
          Invoke-WebRequest "$base/$asset" -OutFile $asset
          Invoke-WebRequest "$base/SHA256SUMS" -OutFile SHA256SUMS
          $expected = ((Get-Content SHA256SUMS | Where-Object { $_.EndsWith($asset) }) -split '\s+')[0]
          if ((Get-FileHash $asset -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'Archive checksum mismatch' }
          Expand-Archive $asset -DestinationPath unpacked
          $bundle = (Get-ChildItem unpacked -Directory)[0].FullName
          foreach ($line in Get-Content "$bundle/MANIFEST.sha256") {
            $parts = $line -split '  ', 2
            if ((Get-FileHash (Join-Path $bundle $parts[1]) -Algorithm SHA256).Hash.ToLower() -ne $parts[0]) { throw 'Bundle checksum mismatch' }
          }
          ./scripts/test-windows-wrapper.ps1 -Bundle $bundle
