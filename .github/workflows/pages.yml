name: Deploy English documentation
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Render current release download links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view --json tagName --jq .tagName > "$RUNNER_TEMP/latest-release" || true
          python - <<'PY'
          import os, re
          from pathlib import Path
          tag = (Path(os.environ['RUNNER_TEMP']) / 'latest-release').read_text().strip()
          if re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag):
              page = Path('site/index.html')
              page.write_text(page.read_text().replace('0.7.1', tag[1:]))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
